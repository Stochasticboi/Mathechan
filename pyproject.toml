[build-system]
requires = ["setuptools>=77", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "mathechan"
version = "0.2.0.dev8"
description = "Experimental symbolic computation and plotting for theoretical physics"
readme = "README.md"
authors = [{name = "Edward Larroza H."}]
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["sympy>=1.14,<1.15"]

[project.urls]
Homepage = "https://github.com/Stochasticboi/Mathechan"
Repository = "https://github.com/Stochasticboi/Mathechan"
Issues = "https://github.com/Stochasticboi/Mathechan/issues"

[project.scripts]
mathechan = "mathechan.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
